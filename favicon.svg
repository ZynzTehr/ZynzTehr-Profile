<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="zt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A66C2" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00f2fe" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle with glowing border -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg-grad)" stroke="url(#zt-grad)" stroke-width="2.5" />

  <!-- Stylized Monogram ZT -->
  <text x="32" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="url(#zt-grad)" letter-spacing="-0.5px" filter="url(#glow)">ZT</text>
</svg>
