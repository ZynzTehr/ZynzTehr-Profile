name: Sync Stack Related Builds

on:
  schedule:
    # Run every Sunday at 00:15 UTC, staggered 15 minutes after midnight jobs
    - cron: "15 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stack-builds
  cancel-in-progress: false

jobs:
  sync:
    name: sync-stack-related-builds
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Install reel encoders (ffmpeg, cwebp)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg webp

      - name: Sync stack builds and reels from GitHub repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: npm run sync:builds

      - name: Check whether stackBuilds.json or reels changed
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          # git status (not git diff) so newly mirrored, untracked reel files count
          if [ -z "$(git status --porcelain -- src/data/stackBuilds.json public/media/builds)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck updated data contract
        if: steps.diff.outputs.changed == 'true'
        run: npm run check

      - name: Run unit and invariant suite
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Verify production bundle
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push updated stackBuilds.json and reels
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/data/stackBuilds.json public/media/builds
          git commit -m "Sync related stack builds and reels from GitHub"
          git pull --rebase origin main
          git push origin HEAD:main
